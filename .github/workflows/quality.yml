name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run weekly on Mondays at 6 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  code-analysis:
    name: Code Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis
      
      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cloc \
            cppcheck \
            shellcheck
      
      - name: Lines of Code Analysis
        run: |
          echo "=== Lines of Code Analysis ==="
          
          if command -v cloc &> /dev/null; then
            cloc --exclude-dir=.git,.github .
          else
            echo "cloc not available, using basic counting"
            echo "C files:"
            find . -name "*.c" | xargs wc -l | tail -1
            echo "Header files:"
            find . -name "*.h" | xargs wc -l | tail -1
          fi
      
      - name: C/C++ Static Analysis
        continue-on-error: true
        run: |
          echo "=== C/C++ Static Analysis ==="
          
          if command -v cppcheck &> /dev/null; then
            # Run cppcheck on a subset of files (to avoid overwhelming output)
            echo "Running cppcheck on sys/src/libc..."
            cppcheck --enable=warning,style,performance,portability \
                     --suppress=missingIncludeSystem \
                     --max-configs=10 \
                     sys/src/libc 2>&1 | head -100 || true
          else
            echo "cppcheck not available"
          fi
      
      - name: Shell Script Analysis
        continue-on-error: true
        run: |
          echo "=== Shell Script Analysis ==="
          
          if command -v shellcheck &> /dev/null; then
            echo "Analyzing shell scripts..."
            find . -name "*.sh" -type f | while read -r script; do
              echo "Checking $script"
              shellcheck "$script" || true
            done | head -100
          else
            echo "shellcheck not available"
          fi
      
      - name: File encoding check
        run: |
          echo "=== File Encoding Check ==="
          
          # Check for non-ASCII characters in source files
          echo "Checking for non-ASCII characters..."
          find sys/src -name "*.c" -o -name "*.h" | head -50 | while read -r file; do
            if grep -P '[^\x00-\x7F]' "$file" > /dev/null 2>&1; then
              echo "Non-ASCII found in: $file"
            fi
          done | head -20 || echo "All checked files are ASCII"
      
      - name: Header guard analysis
        run: |
          echo "=== Header Guard Analysis ==="
          
          # Check for header guards in .h files
          echo "Checking header files for include guards..."
          
          missing_guards=0
          checked=0
          
          find sys/include -name "*.h" -type f | head -20 | while read -r header; do
            checked=$((checked + 1))
            if ! grep -q "#ifndef\|#pragma once" "$header"; then
              echo "Missing guard: $header"
              missing_guards=$((missing_guards + 1))
            fi
          done
          
          echo "Checked $checked headers"
      
      - name: Code duplication check
        continue-on-error: true
        run: |
          echo "=== Code Duplication Check ==="
          
          # Simple duplication check using basic patterns
          echo "Looking for potential code duplication..."
          
          # Find files with similar names (potential duplicates)
          find sys/src -name "*.c" -type f | \
            xargs -I {} basename {} | \
            sort | uniq -c | sort -rn | \
            awk '$1 > 1 {print "Potential duplicate basename: " $2 " (" $1 " files)"}' | \
            head -10

  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check documentation completeness
        run: |
          echo "=== Documentation Completeness Check ==="
          
          # Check for README
          if [ -f "README" ]; then
            echo "✓ README exists"
            wc -l README
          else
            echo "✗ README missing"
          fi
          
          # Check for LICENSE
          if [ -f "LICENSE" ]; then
            echo "✓ LICENSE exists"
          else
            echo "✗ LICENSE missing"
          fi
          
          # Check for documentation directory
          if [ -d "sys/doc" ]; then
            echo "✓ Documentation directory exists"
            doc_files=$(find sys/doc -type f | wc -l)
            echo "  Documentation files: $doc_files"
          fi
          
          # Check for man pages
          if [ -d "sys/man" ]; then
            echo "✓ Man pages directory exists"
            man_files=$(find sys/man -type f | wc -l)
            echo "  Man pages: $man_files"
          fi
      
      - name: Check for TODO/FIXME comments
        run: |
          echo "=== TODO/FIXME Comments ==="
          
          echo "Finding TODO and FIXME comments..."
          find sys/src -name "*.c" -o -name "*.h" | \
            xargs grep -n -i "TODO\|FIXME\|XXX\|HACK" 2>/dev/null | \
            head -30 || echo "No TODO/FIXME comments found in sample"
      
      - name: Check for inline documentation
        run: |
          echo "=== Inline Documentation Check ==="
          
          # Count comments in C files
          echo "Checking comment density in C files..."
          
          total_lines=$(find sys/src -name "*.c" | head -50 | xargs wc -l | tail -1 | awk '{print $1}')
          comment_lines=$(find sys/src -name "*.c" | head -50 | xargs grep -c "^\s*//" 2>/dev/null | awk '{sum+=$1} END {print sum}')
          
          echo "Total lines (sample): $total_lines"
          echo "Comment lines (sample): $comment_lines"

  build-system-check:
    name: Build System Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Analyze build system
        run: |
          echo "=== Build System Analysis ==="
          
          # Count mkfiles
          mkfile_count=$(find . -name "mkfile" -type f | wc -l)
          echo "Total mkfiles: $mkfile_count"
          
          # Check for mkfiles in critical locations
          critical_mkfiles=(
            "sys/src/mkfile"
            "sys/src/libc/mkfile"
            "386/mkfile"
            "amd64/mkfile"
          )
          
          for mkfile in "${critical_mkfiles[@]}"; do
            if [ -f "$mkfile" ]; then
              echo "✓ $mkfile exists"
            else
              echo "✗ $mkfile missing"
            fi
          done
      
      - name: Check architecture support
        run: |
          echo "=== Architecture Support Analysis ==="
          
          archs=(386 amd64 arm mips power power64 sparc)
          
          for arch in "${archs[@]}"; do
            if [ -d "$arch" ]; then
              echo "Architecture: $arch"
              
              # Check for mkfile
              if [ -f "$arch/mkfile" ]; then
                echo "  ✓ Has mkfile"
                cat "$arch/mkfile"
              fi
              
              # Check for include directory
              if [ -d "$arch/include" ]; then
                headers=$(find "$arch/include" -name "*.h" 2>/dev/null | wc -l)
                echo "  ✓ Has $headers header files"
              fi
              
              # Check for bin directory
              if [ -d "$arch/bin" ]; then
                bins=$(find "$arch/bin" -type f 2>/dev/null | wc -l)
                echo "  ✓ Has $bins binaries"
              fi
              
              echo ""
            fi
          done
      
      - name: Dependency analysis
        run: |
          echo "=== Dependency Analysis ==="
          
          # Analyze #include patterns
          echo "Most commonly included headers:"
          find sys/src -name "*.c" | head -100 | \
            xargs grep "^#include" 2>/dev/null | \
            awk '{print $2}' | \
            sort | uniq -c | sort -rn | head -20

  consistency-check:
    name: Consistency Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check file naming conventions
        run: |
          echo "=== File Naming Convention Check ==="
          
          # Check for spaces in filenames
          echo "Checking for spaces in filenames..."
          if find . -name "* *" -type f | grep -v ".git"; then
            echo "✗ Found files with spaces"
          else
            echo "✓ No files with spaces found"
          fi
          
          # Check for uppercase in filenames (excluding README, LICENSE, etc.)
          echo "Checking for unexpected uppercase..."
          find sys/src -name "*.c" -o -name "*.h" | \
            grep "[A-Z]" | head -10 || echo "✓ Consistent lowercase naming"
      
      - name: Line ending check
        run: |
          echo "=== Line Ending Check ==="
          
          # Check for DOS line endings
          echo "Checking for DOS line endings (CRLF)..."
          dos_files=$(find sys/src -name "*.c" -o -name "*.h" | head -50 | xargs file | grep CRLF | wc -l)
          
          if [ "$dos_files" -gt 0 ]; then
            echo "✗ Found $dos_files files with CRLF line endings"
          else
            echo "✓ All checked files use Unix line endings"
          fi
      
      - name: File permissions check
        run: |
          echo "=== File Permissions Check ==="
          
          # Check for executable source files (usually not desired)
          echo "Checking for executable source files..."
          find sys/src -name "*.c" -o -name "*.h" | \
            while read -r file; do
              if [ -x "$file" ]; then
                echo "Unexpected executable: $file"
              fi
            done | head -20 || echo "✓ No unexpected executable source files"
          
          # Check for shell scripts without execute permission
          echo "Checking shell scripts..."
          find . -name "*.sh" -type f | \
            while read -r script; do
              if [ ! -x "$script" ]; then
                echo "Not executable: $script"
              fi
            done | head -10 || echo "✓ Shell scripts are executable"

  quality-metrics:
    name: Quality Metrics
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Generate quality report
        run: |
          echo "=== Code Quality Metrics Report ==="
          echo ""
          
          # Repository statistics
          echo "Repository Statistics:"
          echo "======================"
          
          # Total files
          total_files=$(find . -type f | wc -l)
          echo "Total files: $total_files"
          
          # Source files
          c_files=$(find . -name "*.c" | wc -l)
          h_files=$(find . -name "*.h" | wc -l)
          sh_files=$(find . -name "*.sh" | wc -l)
          
          echo "C source files: $c_files"
          echo "Header files: $h_files"
          echo "Shell scripts: $sh_files"
          
          # Build files
          mkfiles=$(find . -name "mkfile" | wc -l)
          echo "Mkfiles: $mkfiles"
          
          # Directory structure
          echo ""
          echo "Directory Structure:"
          echo "===================="
          du -sh sys lib 386 amd64 arm 2>/dev/null | column -t
          
          # Architecture support
          echo ""
          echo "Supported Architectures:"
          echo "========================"
          for arch in 386 amd64 arm mips power power64 sparc; do
            if [ -d "$arch" ]; then
              size=$(du -sh "$arch" 2>/dev/null | cut -f1)
              echo "  ✓ $arch ($size)"
            fi
          done

  summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [code-analysis, documentation-check, build-system-check, consistency-check, quality-metrics]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "=========================================="
          echo "       Code Quality Check Summary"
          echo "=========================================="
          echo ""
          echo "Code Analysis:       ${{ needs.code-analysis.result }}"
          echo "Documentation:       ${{ needs.documentation-check.result }}"
          echo "Build System:        ${{ needs.build-system-check.result }}"
          echo "Consistency:         ${{ needs.consistency-check.result }}"
          echo "Quality Metrics:     ${{ needs.quality-metrics.result }}"
          echo ""
          
          if [ "${{ needs.code-analysis.result }}" != "success" ] || \
             [ "${{ needs.documentation-check.result }}" != "success" ] || \
             [ "${{ needs.build-system-check.result }}" != "success" ] || \
             [ "${{ needs.consistency-check.result }}" != "success" ] || \
             [ "${{ needs.quality-metrics.result }}" != "success" ]; then
            echo "⚠️  Some quality checks need attention"
            exit 1
          else
            echo "✅ All quality checks passed"
          fi
